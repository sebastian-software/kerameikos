<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TERMINARO">
  <defs>
    <style>
      @font-face{ font-family:"Cinzel Hellenic"; src:url("CinzelHellenic-Regular.ttf") format("truetype"); }
      .navy { fill:#0E2A4D; }
      .gold { fill:#BC8A45; }
      .stem { fill:none; stroke:#BC8A45; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .ring { fill:none; stroke:#BC8A45; stroke-width:6; }
      .wordmark { font-family:"Cinzel Hellenic", serif; font-weight:400; }
    </style>
  </defs>
  <g transform="translate(160.0,24)">
    <!-- Gemeinsame Basis: Goldring -->
  <circle class="ring" cx="120" cy="120" r="112"/>

  <defs>
    <!-- Eine Person: Kopf (echter Kreis) + geglaetteter Koerper.
         Wird fuer die rechte Person an der Mittelachse (x=275) gespiegelt. -->
    <g id="t-person" class="navy">
      <circle cx="174.7" cy="155" r="34"/>
      <path d="M 246.34,468.60 C 241.25,463.48 226.91,446.08 215.79,437.92 C 204.67,429.76 192.48,425.07 179.64,419.64 C 166.80,414.22 150.95,412.54 138.75,405.34 C 126.54,398.15 115.02,387.76 106.44,376.46 C 97.85,365.17 91.03,351.25 87.26,337.57 C 83.49,323.89 82.06,308.42 83.82,294.37 C 85.58,280.32 90.60,265.41 97.83,253.27 C 105.05,241.12 115.60,229.37 127.17,221.48 C 138.75,213.59 153.59,207.01 167.27,205.92 C 180.94,204.83 201.13,209.92 209.23,214.95 C 217.32,219.98 221.04,229.12 215.84,236.11 C 210.64,243.11 187.97,247.27 178.02,256.93 C 168.08,266.59 159.89,280.68 156.18,294.05 C 152.48,307.43 152.06,323.88 155.79,337.18 C 159.52,350.48 168.50,364.24 178.58,373.85 C 188.65,383.46 206.41,386.17 216.24,394.86 C 226.07,403.55 232.56,413.70 237.58,425.99 C 242.60,438.28 244.88,461.49 246.34,468.60 Z"/>
    </g>
  </defs>

  <!-- Motiv: zentriert & skaliert auf den gemeinsamen Ring -->
  <g transform="translate(120,120) scale(0.47) translate(-275,-275)">
    <use href="#t-person"/>
    <use href="#t-person" transform="matrix(-1,0,0,1,550,0)"/>
    <!-- Drei identische, symmetrische Punkte (echte Kreise) -->
    <circle class="gold" cx="234" cy="336" r="8"/>
    <circle class="gold" cx="275"    cy="336" r="8"/>
    <circle class="gold" cx="316" cy="336" r="8"/>
  </g>
  </g>
  <text class="wordmark navy" x="280.0" y="352" font-size="64" letter-spacing="7" text-anchor="middle">TERMINARO</text>
  <line x1="70" y1="388" x2="150" y2="388" stroke="#BC8A45" stroke-width="1.5"/>
  <line x1="410" y1="388" x2="490" y2="388" stroke="#BC8A45" stroke-width="1.5"/>
  <text id="subtitle" class="wordmark gold" x="280.0" y="393" font-size="12.5" letter-spacing="3" text-anchor="middle">SCHEDULING SOLUTION</text>
</svg>
